version: '3.8'

services:
  app:
    container_name: app_container
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - pgadmin
      - redis
      - redis-insight

  postgres:
    image: postgres:latest
    container_name: postgres_container
    restart: always
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_container
    restart: always
    depends_on:
      - postgres
    ports:
      - "${PG_ADMIN_PORT}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PG_ADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PG_ADMIN_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    command: >
      sh -c "echo 'Server 0.0.0.0 80' > /pgadmin4/servers.json &&
             /entrypoint.sh"

  redis:
    image: redis:latest
    container_name: redis_container
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight_container
    restart: always
    depends_on:
      - redis
    ports:
      - "${REDIS_INSIGHT_PORT}:5540"
    volumes:
      - redis-insight:/data

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  redis-insight:
